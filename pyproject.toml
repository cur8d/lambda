[project]
name = "templates"
version = "0.1.0"
description = "AWS Lambda Templates"
authors = [{name = "Amr Abed", email = ""}]
license = {text = "MIT"}
readme = "docs/README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.16.0",
    "aws-lambda-powertools>=3.36.0",
    "boto3>=1.43.115",
    "requests>=2.34.2",
]

[project.scripts]
new = "scripts.new:main"
init = "scripts.init:main"

[dependency-groups]
infra = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "coverage>=7.16.2",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest-mock>=3.17.0",
    "moto>=5.2.1",
    "hypothesis>=6.170.5",
    "click>=8.4.2",
    "pip-audit>=2.10.1",
]
docs = [
    "zensical>=0.0.73",
    "mkdocstrings[python]>=1.0.8",
]

[tool.uv]
default-groups = ["infra", "dev", "docs"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "I"]

[tool.coverage.run]
branch = true
source = ["templates"]

[tool.coverage.report]
omit = ["tests/*"]
fail_under = 90

[tool.pyright]
exclude = ["**/__pycache__", "**/.pytest_cache", ".venv"]
reportMissingImports = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
