[project]
site_name = "AWS Lambda Templates - Python"
site_url = "https://github.com/amrabed/aws-lambda-templates"
repo_url = "https://github.com/amrabed/aws-lambda-templates"
repo_name = "amrabed/aws-lambda-templates"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026"

nav = [
  { "Overview" = [
    { "Overview" = "README.md" },
    { "Contributing" = "CONTRIBUTING.md" },
    { "License" = "LICENSE.md" },
  ] },
  { "Templates" = [
    { "Bedrock Agent" = "template/agent.md" },
    { "GraphQL API" = "template/graphql.md" },
    { "REST API" = "template/api.md" },
    { "DynamoDB Stream" = "template/stream.md" },
    { "EventBridge" = "template/eventbridge.md" },
    { "S3 to SQS" = "template/s3.md" },
    { "SQS to DynamoDB" = "template/sqs.md" },
  ] },
  { "Reference" = [
    { "Bedrock Agent" = "reference/agent.md" },
    { "GraphQL API" = "reference/graphql.md" },
    { "REST API" = "reference/api.md" },
    { "DynamoDB Stream" = "reference/stream.md" },
    { "EventBridge" = "reference/eventbridge.md" },
    { "S3" = "reference/s3.md" },
    { "SQS" = "reference/sqs.md" },
    { "Models" = "reference/models.md" },
    { "Queue" = "reference/queue.md" },
    { "Repository" = "reference/repository.md" },
    { "Settings" = "reference/settings.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
